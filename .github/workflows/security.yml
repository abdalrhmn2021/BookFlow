# Automatic security checks (docs/SECURITY-REVIEW.md, "الفحص التلقائي"):
#   audit   - known holes in the packages that ship (server/ and client/, dev tools left out).
#             Also every Monday: a hole published AFTER our last push shows up without a push.
#   secrets - gitleaks over the WHOLE git history: a key that was ever committed, even if it was
#             deleted later, is still in the history. Findings are printed redacted.
#   codeql  - GitHub's static analysis of the JS/TS code and of these workflow files (injection,
#             open redirects, XSS...). Results: the repo's Security tab > Code scanning.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

# Read-only by default (review E-04); only the CodeQL job may write its results.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: [server, client]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Reads package-lock.json only: no install needed.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not only the last one
          persist-credentials: false
      # Rules: gitleaks' defaults + .gitleaks.toml (the tests' made-up secrets).
      - name: gitleaks (whole history)
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write # upload the results to Security > Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
