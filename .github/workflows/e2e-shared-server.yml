# TEMPORARY - full trial of docs/INSTALL.md with ONE shared server and TWO clients:
# real MongoDB -> setup-client x2 -> shared server (no sign-up, no directory) ->
# two production builds with different brands -> a browser that sets up and books.
# Results are pushed to the e2e-results branch. Not meant for main.
name: E2E shared-server trial

on:
  push:
    branches: [test/e2e-shared-server]

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/bookflow-clients?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start MongoDB 8.2 (single-node replica set)
        run: |
          set +e
          docker run -d --name mongo -p 27017:27017 mongo:8.2 --replSet rs0 --bind_ip_all
          m() { docker exec mongo mongosh --quiet --eval "$1" 2>&1; }
          for i in $(seq 1 60); do [ "$(m 'db.adminCommand({ping:1}).ok')" = "1" ] && break; sleep 2; done
          for i in $(seq 1 10); do
            out=$(m "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok } catch (e) { e.codeName === 'AlreadyInitialized' ? 1 : e.message }")
            [ "$out" = "1" ] && break; sleep 2
          done
          for i in $(seq 1 60); do [ "$(m 'db.hello().isWritablePrimary')" = "true" ] && echo ready && exit 0; sleep 2; done
          echo "::error::MongoDB not ready"; exit 1

      - name: Install
        run: |
          (cd server && npm ci) && (cd client && npm ci)
          npm i --no-save --no-audit --no-fund puppeteer-core
          mkdir -p e2e-out

      # Guide step B1, once per client - both on the SAME database
      - name: setup-client for two clients
        working-directory: server
        run: |
          pw() { grep "Password:" "$1" | awk '{print $2}'; }
          npm run setup-client -- --name "صالون ليلى" --slug laila-salon --owner "ليلى" --email laila@test.com | tee ../e2e-out/setup-laila.txt
          npm run setup-client -- --name "عيادة ريم" --slug reem-clinic --owner "ريم" --email reem@test.com | tee ../e2e-out/setup-reem.txt
          echo "LAILA_PW=$(pw ../e2e-out/setup-laila.txt)" >> $GITHUB_ENV
          echo "REEM_PW=$(pw ../e2e-out/setup-reem.txt)" >> $GITHUB_ENV

      # Guide part A - ONE server for every client
      - name: Start the shared server
        working-directory: server
        env:
          NODE_ENV: production
          PORT: 5000
          JWT_SECRET: e2e-secret-0123456789012345678901234567890123456789
          JWT_EXPIRES_IN: 7d
          CLIENT_URL: http://localhost:3000,http://127.0.0.1:3001
          ALLOW_BUSINESS_SIGNUP: "false"
          PUBLIC_DIRECTORY: "false"
        run: |
          nohup npm start > ../e2e-out/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/ >/dev/null && echo up && exit 0; sleep 1; done
          cat ../e2e-out/server.log; exit 1

      # Guide step B2 for client 1
      - name: Laila's site (purple)
        working-directory: client
        env:
          API_URL: http://localhost:5000
          NEXT_PUBLIC_DEMO_MODE: "false"
          SINGLE_BUSINESS_SLUG: laila-salon
          BRAND_NAME: Laila Salon
          BRAND_NAME_AR: صالون ليلى
          BRAND_COLOR: "#7c3aed"
          BRAND_LOGO_URL: /clients/laila-salon/logo.svg
        run: |
          cp -a . ../client-reem   # a clean copy for the second client's build
          mkdir -p public/clients/laila-salon
          echo '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#7c3aed"/><text x="20" y="27" font-size="20" text-anchor="middle" fill="#fff" font-family="sans-serif">L</text></svg>' > public/clients/laila-salon/logo.svg
          npm run build > ../e2e-out/build-laila.log 2>&1 || { tail -40 ../e2e-out/build-laila.log; exit 1; }
          nohup npm start -- -p 3000 > ../e2e-out/laila.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/login && echo up && exit 0; sleep 1; done
          exit 1

      # Guide step B2 for client 2
      - name: Reem's site (blue)
        working-directory: client-reem
        env:
          API_URL: http://localhost:5000
          NEXT_PUBLIC_DEMO_MODE: "false"
          SINGLE_BUSINESS_SLUG: reem-clinic
          BRAND_NAME: Reem Clinic
          BRAND_NAME_AR: عيادة ريم
          BRAND_COLOR: "#0ea5e9"
        run: |
          npm run build > ../e2e-out/build-reem.log 2>&1 || { tail -40 ../e2e-out/build-reem.log; exit 1; }
          nohup npm start -- -p 3001 > ../e2e-out/reem.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3001/login && echo up && exit 0; sleep 1; done
          exit 1

      - name: Browser trial
        run: CHROME_PATH=$(which google-chrome) node e2e/shared-server.mjs "$LAILA_PW" "$REEM_PW"

      - name: Publish results to the e2e-results branch
        if: always()
        run: |
          cd e2e-out
          sed -i -E 's/(Password:  )[A-Za-z0-9]+/\1****/' setup-*.txt 2>/dev/null || true
          git init -q -b e2e-results
          git config user.name "e2e" && git config user.email "e2e@users.noreply.github.com"
          git add -A && git commit -q -m "E2E shared-server results for ${GITHUB_SHA::7} (${{ job.status }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e2e-results
