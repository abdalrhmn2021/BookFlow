# ============================================================
# CI: مع كل push على main (وكل pull request) GitHub بيشغّل اختبارات السيرفر
# على سيرفر لينكس نظيف. إذا فشل أي اختبار بتطلع ❌ حمرا جنب الـ commit.
# ============================================================
name: Server tests

# ⏸️ متوقف مؤقتاً: ما بيشتغل تلقائياً مع كل push لحد ما نصلّح الاتصال بـ MongoDB على GitHub.
# بتقدر تشغّله يدوياً من تبويب Actions -> Server tests -> Run workflow.
# لما يزبط: رجّع push و pull_request هون.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    # حماية: لو علق أي شي، وقّف بعد 15 دقيقة بدل ما يضل شغال ساعات
    timeout-minutes: 15
    env:
      # الاختبارات بتتصل بـ MongoDB اللي بنشغّلها تحت بـ Docker.
      # 127.0.0.1 مش localhost: Node الجديد بيترجم localhost لـ IPv6 (::1)
      # و Docker فاتح البورت على IPv4 -> الاتصال كان بينرفض.
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/?replicaSet=rs0

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # MongoDB حقيقية بـ Docker كـ replica set (الحجز بيستخدم transactions، وهي بدها replica set)
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then
              echo "MongoDB replica set is ready"
              exit 0
            fi
            sleep 2
          done
          # ما جهزت -> وقّف هون برسالة واضحة بدل ما الاختبارات تستنى وتفشل بعد 6 دقايق
          echo "MongoDB did not become ready"
          docker logs mongo
          exit 1

      - run: npm ci

      - run: npm test -- --forceExit
