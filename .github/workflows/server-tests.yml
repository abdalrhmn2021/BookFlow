# ============================================================
# CI: مع كل push على main (وكل pull request) GitHub بيشغّل اختبارات السيرفر
# على سيرفر لينكس نظيف. إذا فشل أي اختبار بتطلع ❌ حمرا جنب الـ commit.
#
# الداتابيس: ما في Docker ولا Atlas. الاختبارات (tests/helpers.js) لما ما تلاقي
# MONGO_URI ولا MONGO_URI_TEST بتشغّل MongoDB مؤقتة بالذاكرة كـ replica set
# (mongodb-memory-server) - نفس اللي بيصير على جهازك لو ما حطيت رابط.
# أبسط وأثبت من تشغيل Docker وانتظار الـ replica set يجهز.
# ============================================================
name: Server tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # تشغيل يدوي من تبويب Actions

jobs:
  test:
    runs-on: ubuntu-24.04
    # حماية: لو علق أي شي، وقّف بعد 15 دقيقة بدل ما يضل شغال ساعات
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      # ملف MongoDB اللي بتنزّله mongodb-memory-server (~100MB) - نخزّنه
      # عشان كل تشغيل بعد الأول ما ينزّله من جديد
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - run: npm ci

      - run: npm test -- --forceExit
