# Render "Blueprint": describes the backend service so Render can create it in one click
# (Dashboard -> New -> Blueprint -> pick this repo).
# Values marked `sync: false` are secrets - Render asks you for them, they never live in git.
services:
  - type: web
    name: bookflow-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # your MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true # Render creates a long random secret for you
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # your Vercel URL, e.g. https://bookflow.vercel.app
      # --- Sold copies: ONE shared server for all clients (docs/INSTALL.md) ---
      # "true" on the clients' server, empty on the demo platform.
      - key: SHARED_SERVER
        sync: false
      # Same value on every Vercel site of this server (copy it from Render). Required when
      # SHARED_SERVER=true; on the demo it lets the rate limits see each visitor's real IP.
      - key: SITE_PROXY_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false # optional: new-booking emails (see docs/INSTALL.md)
      - key: MAIL_FROM
        sync: false # optional: a sender address verified in Brevo
      # --- Automatic WhatsApp reminders (optional, docs/INSTALL.md) ---
      - key: WHATSAPP_TOKEN
        sync: false # Meta system-user token with whatsapp_business_messaging
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_TEMPLATE
        value: booking_reminder
      - key: WHATSAPP_TEMPLATE_LANG
        value: ar
      - key: JOBS_SECRET
        generateValue: true # for an outside cron calling POST /api/jobs/reminders
